 s.strokeStyle='#e0c7be';s.lineWidth=2.1;s.lineCap='round';s.beginPath();s.moveTo(0,9);s.lineTo(0,-9);s.moveTo(0,-7);s.quadraticCurveTo(-3,-13,-7,-14);s.moveTo(0,-7);s.quadraticCurveTo(3,-13,7,-14);s.stroke();s.restore();});
}
const pollen=Array.from({length:88},(_,i)=>({f:flowers[i%flowers.length],phase:Math.random()*TAU,life:4+Math.random()*4,seed:Math.random()*20,delay:Math.random()*6}));
let bursts=[];
function mote(x,y,alpha,r,bright){if(alpha<=.025)return;s.save();s.globalAlpha=alpha;s.fillStyle=bright?'#fff1be':'#efbe70';s.beginPath();s.arc(x,y,r,0,TAU);s.fill();if(bright){s.fillRect(x-r*1.7,y-.6,r*3.4,1.2);s.fillRect(x-.6,y-r*1.7,1.2,r*3.4);}s.restore();}
function pollenAt(t){
 for(const m of pollen){let start=m.f.delay+.9+m.delay;if(t<start)continue;let u=((t-start)%m.life)/m.life,p=point(m.f,t),ang=m.phase+u*1.5;let a=ease(u/.16)*ease((1-u)/.3)*(.35+.65*Math.pow(.5+.5*Math.sin(t*3+m.seed),2));
 mote(p.x+Math.cos(ang)*(12+u*53)+Math.sin(t*.8+m.seed)*8,p.y-m.f.r*.38-u*(42+10*Math.sin(m.seed))+Math.sin(ang)*15,a*.83,1.6+1.0*Math.sin(m.seed)**2,Math.sin(t*3+m.seed)>.72);}
 bursts=bursts.filter(b=>t-b.start<2.1);for(const b of bursts){let d=t-b.start,u=d/2.1;if(d<0)continue;let k=1-Math.exp(-d*2.4);mote(b.x+Math.cos(b.a)*b.r*k,b.y+Math.sin(b.a)*b.r*k-23*d,ease(1-u)*.95,b.size,true);}
}
function draw(now){requestAnimationFrame(draw);if(document.hidden)return;if(reduced&&last&&now-last<1000)return;if(now-last<(worldTime>5.8?21:28))return;last=now;let t=reduced?12:(now-started)/1000;worldTime=t;
 let dt=lastTime?Math.min(.1,(now-lastTime)/1000):.033;lastTime=now;
 camera.x+=(camera.tx-camera.x)*(1-Math.exp(-dt*3.8));camera.y+=(camera.ty-camera.y)*(1-Math.exp(-dt*3.8));
 setup();
 sprigs.forEach(f=>sprig(f,t,ease((t-.04-f.seed*.013)/1.65)));
 flowers.forEach(f=>stem(f,t,ease((t-f.stemDelay)/.85)));
 flowers.forEach(f=>{let age=t-f.delay;head(f,t,age);});
 if(!reduced){falling(t);pollenAt(t);butterfliesAt(t);} 
 const data=s.getImageData(0,0,source.width,source.height).data;ctx.clearRect(0,0,W,H);
 // The only visible marks are ASCII glyphs. No raster image is displayed.
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
  let rr=0,gg=0,bb=0,aa=0;for(let j=0;j<2;j++)for(let i=0;i<2;i++){let n=((y*2+j)*source.width+x*2+i)*4,a=data[n+3]/255;rr+=data[n]*a;gg+=data[n+1]*a;bb+=data[n+2]*a;aa+=a;}
  if(aa<.54)continue;rr/=aa;gg/=aa;bb/=aa;let lum=(rr*.27+gg*.53+bb*.20)/255;let density=clamp((.24+lum*.98)*Math.pow(aa/4,.57));let idx=Math.min(ramp.length-1,Math.floor(density*ramp.length));
  ctx.fillStyle=`rgba(${Math.min(255,Math.round(rr*1.20+21))},${Math.min(255,Math.round(gg*1.16+15))},${Math.min(255,Math.round(bb*1.15+16))},${Math.min(1,aa/3)})`;ctx.fillText(ramp[idx],(x+.5)*cw,Math.min(H-1,(y+.5)*ch));
 }
}
// The garden is discoverable without instructions or visible controls.
function steer(e){if(reduced)return;camera.tx=clamp((e.clientX/W-.5)*19,-9.5,9.5);camera.ty=clamp((e.clientY/H-.5)*13,-6.5,6.5);}
canvas.addEventListener('pointermove',steer,{passive:true});
canvas.addEventListener('pointerleave',()=>{camera.tx=camera.ty=0;});
canvas.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')camera.tx=camera.ty=0;});
canvas.addEventListener('pointercancel',()=>{camera.tx=camera.ty=0;});
canvas.addEventListener('pointerdown',e=>{if(reduced)return;steer(e);const t=worldTime,x=(e.clientX-left)/fit,y=(e.clientY-offsetY)/fit;
 let hit=null,score=1.15;for(const f of flowers){if(t<f.delay+.25)continue;let p=point(f,t),d=Math.hypot(x-p.x,(y-p.y+f.r*.28)*1.15)/f.r;if(d<score){hit=f;score=d;}}
 if(!hit)return;hit.touch=t;let pos=point(hit,t);for(let i=0;i<30;i++)bursts.push({start:t,x:pos.x+hit.nx*hit.r*.25,y:pos.y-hit.r*.35,a:Math.random()*TAU,r:22+Math.random()*66,size:1.5+Math.random()*1.7});if(bursts.length>180)bursts=bursts.slice(-180);
 for(const b of butterflies){if(b.state==='rest'&&b.target&&Math.hypot(b.target.x-hit.x,b.target.y-hit.y)<125)b.target.touch=t;}
});

let hiddenAt=null;
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){hiddenAt=performance.now();}
 else if(hiddenAt!==null){started+=performance.now()-hiddenAt;hiddenAt=null;lastTime=0;}
});
requestAnimationFrame(draw);
</script>
